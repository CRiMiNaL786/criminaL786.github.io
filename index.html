    (function () {

    <!-- Custom Sun/Cloud <-> Moon/Stars Pill Toggle -->
    <button
      type="button"
      class="theme-switch"
      id="themeToggle"
      role="switch"
      aria-checked="false"
      aria-label="Toggle dark mode"
      title="Switch Water / Flame mode"
    >
      <span class="switch-track">
        <!-- Stars (visible in Dark / Flame mode) -->
        <span class="star star-1"></span>
        <span class="star star-2"></span>
        <span class="star star-3"></span>

        <!-- Thumb (Sun in Light mode, Moon in Dark mode) -->
        <span class="switch-thumb">
          <span class="crater crater-1"></span>
          <span class="crater crater-2"></span>
        </span>

        <!-- Cloud (visible in Light / Water mode) -->
        <span class="cloud"></span>
      </span>
    </button>

  <!-- Avatar Preview Modal -->
  <dialog class="modal" id="avatarModal" aria-label="Profile picture">
    <div class="modal-inner modal-img-wrap">
      <button type="button" class="modal-close" data-close aria-label="Close">&times;</button>
      <img
        src="https://telegra.ph/file/7eaef5aa3aafa9bf9ca36.jpg"
        alt="@criminal786"
        onerror="this.onerror=null; this.src='https://github.com/criminal786.png';"
      />
    </div>
  </dialog>

  <!-- More Info Modal -->
  <dialog class="modal" id="infoModal" aria-labelledby="infoTitle">
    <div class="modal-inner">
      <div class="modal-top">
        <h2 id="infoTitle">@criminal786</h2>
        <button type="button" class="modal-close" data-close aria-label="Close">&times;</button>
      </div>
      <p>
        Also Known As <strong>Amaan The Gamer King</strong>. Check out my projects on GitHub, gaming &amp; mod videos on YouTube, or message me on Telegram.

      <div class="action-buttons">

        </a>

  <script>
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const menuToggle = document.getElementById('menuToggle');
    const navDropdown = document.getElementById('navDropdown');
    const avatarModal = document.getElementById('avatarModal');
    const infoModal = document.getElementById('infoModal');

    function syncSwitchAria() {
      const isDark = root.getAttribute('data-theme') === 'dark';
      themeToggle.setAttribute('aria-checked', String(isDark));
    }
    syncSwitchAria();

    themeToggle.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      syncSwitchAria();
    });

    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = navDropdown.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', String(open));
    });

    document.addEventListener('click', (e) => {
      if (!navDropdown.contains(e.target) && e.target !== menuToggle) {
        navDropdown.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', 'false');
      }
    });

    document.getElementById('avatarTrigger').addEventListener('click', () => avatarModal.showModal());
    document.getElementById('moreTrigger').addEventListener('click', () => infoModal.showModal());

    document.querySelectorAll('.modal').forEach((m) => {
      m.querySelector('[data-close]').addEventListener('click', () => m.close());
      m.addEventListener('click', (e) => {
        if (e.target === m) m.close();
      });
    });
  </script>
</body>
</html>
